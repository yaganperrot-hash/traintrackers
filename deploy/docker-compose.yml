# VPS : cd ~/monretard/deploy && docker compose up -d --build
# Projet séparé de rertracker : aucun réseau, volume ni base partagés.
# Mot de passe de la base : deploy/.env sur le serveur seulement (voir .env.example), jamais commité.
name: monretard

x-commun: &commun
  build: { context: .., dockerfile: deploy/Dockerfile }
  image: monretard-app
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

services:
  collecte:
    <<: *commun
    command: ["python", "poc/collect.py"]
    volumes: ["../data:/app/poc/data"]
    mem_limit: 256m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: monretard
      POSTGRES_USER: monretard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe absent de deploy/.env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U monretard"], interval: 10s, retries: 5 }
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }
    mem_limit: 512m

  ingestion:
    <<: *commun
    command: ["python", "-m", "backend.ingestion"]
    environment:
      DATABASE_URL: postgresql://monretard:${POSTGRES_PASSWORD}@db:5432/monretard
    volumes: ["../data:/app/poc/data:ro"]
    depends_on: { db: { condition: service_healthy } }
    mem_limit: 512m

  api:
    <<: *commun
    command: ["uvicorn", "backend.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      DATABASE_URL: postgresql://monretard:${POSTGRES_PASSWORD}@db:5432/monretard
    # Pas encore public (pas de domaine) : écoute seulement sur le VPS lui-même.
    # Depuis le PC : ssh -N -L 8100:127.0.0.1:8100 ubuntu@149.56.102.94  puis http://127.0.0.1:8100
    ports: ["127.0.0.1:8100:8000"]
    depends_on: { db: { condition: service_healthy } }
    mem_limit: 256m

volumes:
  pgdata:
